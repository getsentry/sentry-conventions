name: Build and Test

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install node modules
        run: yarn install --frozen-lockfile

      - name: Run generate
        run: yarn generate

      - name: Format generated code
        run: yarn format

      - name: Run tests
        run: yarn test

      - name: Run lints
        run: yarn lint

      - name: Check for changes
        if: matrix.os == 'ubuntu-latest'
        id: verify-changed-files
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "Uncommitted changes found after build/script execution. Failing job."
            git status
            exit 1
          else
            echo "Working tree is clean. No uncommitted changes found."
            exit 0
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install node modules
        run: yarn install --frozen-lockfile

      - name: Build Packages
        run: yarn build

      - name: Generate tarball artifact
        run: yarn build:tarball

      - name: Upload artifacts for release via getsentry/craft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.sha }}
          path: |
            javascript/**/*.tgz
            python/**/*.whl
            model/**/*.tgz
          if-no-files-found: error

  build-docs:
    name: Build Docs (${{ matrix.host }})
    strategy:
      matrix:
        host: [github-pages, vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Astro site
        working-directory: docs
        run: yarn build
        env:
          SENTRY_AUTH_TOKEN: ${{ matrix.host == 'github-pages' && secrets.SENTRY_AUTH_TOKEN || '' }}
          VERCEL: ${{ matrix.host == 'vercel' && '1' || '' }}
          VERCEL_ENV: ${{ matrix.host == 'vercel' && 'preview' || '' }}
          VERCEL_URL: ${{ matrix.host == 'vercel' && 'conventions-preview.vercel.app' || '' }}
